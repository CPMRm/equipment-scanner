<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已借出設備清單</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-top: 10px;
        }

        /* 頂部導覽按鈕區塊 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            background-color: #e5e7eb;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #d1d5db;
        }

        h2 { 
            font-size: 1.3rem; 
            text-align: center;
            flex: 1;
        }

        .refresh-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .equipment-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        .equipment-table th, .equipment-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .equipment-table th {
            background-color: #f9fafb;
            color: var(--text-sub);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #fef3c7;
            color: #92400e;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-sub);
            padding: 30px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 頂部列：新增返回首頁按鈕 -->
    <div class="top-bar">
        <a href="index.html" class="back-btn">🏠 返回首頁</a>
    </div>

    <h2>📋 已借出設備清單</h2>
    <button class="refresh-btn" onclick="loadBorrowedList()">🔄 重新整理清單</button>

    <div id="list-container">
        <div class="empty-msg">資料載入中...</div>
    </div>
</div>

<script>
    // ★請確認這裡貼的是與 index.html 相同的 GAS Web App 網址★
    const API_URL = "https://script.google.com/macros/s/AKfycbz8SKhCct8XraaHN0cgbvKe6FW6gDaRInr6i8fX28NY4HBh5xw1h27TqBaWD09hkOW-Cw/exec";

    function loadBorrowedList() {
        const container = document.getElementById('list-container');
        container.innerHTML = '<div class="empty-msg">資料載入中...</div>';

        fetch(`${API_URL}?action=getBorrowedList`, { method: "GET", redirect: "follow" })
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-msg">🎉 目前沒有任何借出中的設備！</div>';
                    return;
                }

                let html = `
                    <table class="equipment-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>廠牌 / 名稱</th>
                                <th>狀態</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach(item => {
                    const fullName = (item.brand ? item.brand + ' ' : '') + item.name;
                    html += `
                        <tr>
                            <td><b>${item.id}</b></td>
                            <td>${fullName}</td>
                            <td><span class="badge">${item.status}</span></td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = '<div class="empty-msg" style="color:red;">❌ 載入失敗，請確認 API 網址或重新發布 GAS 新版本</div>';
            });
    }

    // 網頁載入時自動執行一次
    loadBorrowedList();
</script>
</body>
</html>
