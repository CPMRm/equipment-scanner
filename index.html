<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備掃描借還系統</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --success-color: #10b981;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-top: 10px;
            text-align: center;
        }

        /* 導覽列連結 */
        .nav-links {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            text-align: center;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .nav-btn.external {
            background-color: #e5e7eb;
            color: var(--text-main);
            border: 1px solid #d1d5db;
        }

        .nav-btn.external:hover {
            background-color: #d1d5db;
        }

        /* 借歸還切換 */
        .mode-toggle {
            display: flex;
            background: #e5e7eb;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-sub);
        }

        .mode-btn.active-borrow { background: var(--primary-color); color: white; }
        .mode-btn.active-return { background: var(--success-color); color: white; }

        select {
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            margin-bottom: 16px;
        }

        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }

        #result {
            margin-top: 16px;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: pre-wrap;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
        }

        .status-loading { color: var(--primary-color); background: #eef2ff !important; }
        .status-success { color: #065f46; background: #d1fae5 !important; }
        .status-error { color: #991b1b; background: #fee2e2 !important; }
    </style>
</head>
<body>

<div class="card">
    <h2>📷 設備掃描借還系統</h2>

    <!-- 頂部導覽：點擊右邊會開啟新分頁 -->
    <div class="nav-links">
        <span class="nav-btn active">📷 掃描借還</span>
        <a href="list.html" target="_blank" class="nav-btn external">📋 開啟借出清單 ↗</a>
    </div>

    <div class="mode-toggle">
        <button id="btn-borrow" class="mode-btn active-borrow" onclick="setMode('borrow')">📤 設備借用</button>
        <button id="btn-return" class="mode-btn" onclick="setMode('return')">📥 設備歸還</button>
    </div>

    <select id="camera-select">
        <option value="">載入相機清單中...</option>
    </select>

    <div id="reader"></div>
    <div id="result">正在啟動相機...</div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzKOj-VImQJKXeHA08DHCWPQoROM6m578I7cGvBMjW6bcDCiXnZ74jH7yMYVZhHYcMI4w/exec";

    let currentMode = "borrow";
    let isProcessing = false;
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 220, height: 220 } };

    const cameraSelect = document.getElementById('camera-select');
    const resultDiv = document.getElementById('result');

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-borrow').className = mode === 'borrow' ? 'mode-btn active-borrow' : 'mode-btn';
        document.getElementById('btn-return').className = mode === 'return' ? 'mode-btn active-return' : 'mode-btn';
        if (!isProcessing) updateStatusText("請對準 QR Code 進行掃描...");
    }

    function updateStatusText(text, statusClass = '') {
        resultDiv.className = statusClass;
        resultDiv.innerText = text;
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        let targetId = decodedText.trim();
        if (targetId.includes("text=")) targetId = targetId.split("text=")[1].split("&")[0];
        else if (targetId.includes("id=")) targetId = targetId.split("id=")[1].split("&")[0];

        const actionText = currentMode === 'borrow' ? '借用' : '歸還';
        updateStatusText(`讀取成功！ID: ${targetId}\n處理【${actionText}】中...`, 'status-loading');

        fetch(`${API_URL}?id=${encodeURIComponent(targetId)}&action=${currentMode}`, {
            method: "GET",
            redirect: "follow"
        })
        .then(res => res.text())
        .then(text => {
            const isSuccess = text.includes("成功");
            updateStatusText(text, isSuccess ? 'status-success' : 'status-error');
            setTimeout(() => {
                isProcessing = false;
                updateStatusText("請對準下一個 QR Code 進行掃描...");
            }, 3500);
        })
        .catch(err => {
            updateStatusText("❌ 連線失敗，請檢查網路！", 'status-error');
            setTimeout(() => { isProcessing = false; }, 3500);
        });
    }

    function startCamera(cameraId) {
        html5QrCode.start(cameraId, config, onScanSuccess)
            .then(() => { updateStatusText("請對準 QR Code 進行掃描..."); })
            .catch(err => updateStatusText("⚠️ 相機啟動失敗", 'status-error'));
    }

    Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
            cameraSelect.innerHTML = "";
            devices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.id;
                option.text = device.label || `鏡頭 ${index + 1}`;
                cameraSelect.appendChild(option);
            });

            const backCamera = devices.find(d => 
                d.label.toLowerCase().includes('back') || 
                d.label.toLowerCase().includes('rear') ||
                d.label.toLowerCase().includes('environment')
            );

            const defaultId = backCamera ? backCamera.id : devices[0].id;
            cameraSelect.value = defaultId;
            startCamera(defaultId);

            cameraSelect.addEventListener('change', () => {
                html5QrCode.stop().then(() => startCamera(cameraSelect.value));
            });
        } else {
            updateStatusText("⚠️ 找不到相機裝置", 'status-error');
        }
    }).catch(err => updateStatusText("⚠️ 無法取得相機權限", 'status-error'));
</script>
</body>
</html>
